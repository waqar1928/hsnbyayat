# Alternate deployment path (VPS/Docker instead of Hostinger/Vercel) — the
# app now targets MySQL/MariaDB (see prisma/schema.prisma), so point
# DATABASE_URL below at a real MySQL instance (a sibling container, a
# managed database, etc). To switch to Postgres instead, see the schema
# comment + src/lib/prisma.ts for the one-line + one-import swap.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a mysql:// connection string}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file or your shell — e.g. openssl rand -base64 48}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hsnbyayat.pk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD for the first admin user}
      ADMIN_NAME: ${ADMIN_NAME:-HSN BY AYAT Admin}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    volumes:
      - uploads-data:/app/public/uploads
    restart: unless-stopped

volumes:
  uploads-data:
