services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a mysql:// connection string}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file or your shell}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hsnbyayat.pk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD for the first admin user}
      ADMIN_NAME: ${ADMIN_NAME:-HSN BY AYAT Admin}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    volumes:
      - uploads-data:/app/public/uploads
    networks:
      internal:
      edge:
        # Compose names the container hsnbyayat-app-1 (service name + replica
        # index), but the shared Caddy instance's Caddyfile (a separate,
        # drevia-managed config outside this repo) already points at
        # reverse_proxy hsnbyayat-app:3000 — this alias makes that hostname
        # resolve on the edge network without touching Caddy's config or
        # renaming the container.
        aliases:
          - hsnbyayat-app
    restart: unless-stopped

networks:
  internal:
    external: true
    name: hsnbyayat_internal
  # Shared reverse-proxy network — the standalone Caddy container (serving
  # hsnbyayat.com + other apps on this VPS) lives here, not on
  # hsnbyayat_internal. Without this, Caddy's reverse_proxy hsnbyayat-app:3000
  # can't resolve the container at all (Docker DNS only resolves within a
  # shared network) — every request 502s even though the app itself is
  # healthy. Same network drevia-web (also Caddy-proxied) is already on.
  edge:
    external: true
    name: drevia_edge

volumes:
  uploads-data:
